services:
  node-1:
    build:
      context: ..
      dockerfile: docker-scenario/Dockerfile
    container_name: raft-node-1
    environment:
      RAFT_NODE_ID: 1
      RAFT_TCP_PORT: 9001
      RAFT_HTTP_PORT: 8080
      RAFT_PEERS: 2=node-2:9001,3=node-3:9001
      RAFT_LOG_LEVEL: info
    ports:
      - "8081:8080"
    networks:
      - raft-network

  node-2:
    build:
      context: ..
      dockerfile: docker-scenario/Dockerfile
    container_name: raft-node-2
    environment:
      RAFT_NODE_ID: 2
      RAFT_TCP_PORT: 9001
      RAFT_HTTP_PORT: 8080
      RAFT_PEERS: 1=node-1:9001,3=node-3:9001
      RAFT_LOG_LEVEL: info
    ports:
      - "8082:8080"
    networks:
      - raft-network

  node-3:
    build:
      context: ..
      dockerfile: docker-scenario/Dockerfile
    container_name: raft-node-3
    environment:
      RAFT_NODE_ID: 3
      RAFT_TCP_PORT: 9001
      RAFT_HTTP_PORT: 8080
      RAFT_PEERS: 1=node-1:9001,2=node-2:9001
      RAFT_LOG_LEVEL: info
    ports:
      - "8083:8080"
    networks:
      - raft-network

networks:
  raft-network:
    driver: bridge
